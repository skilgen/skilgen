[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilgen"
version = "0.6.0"
description = "Generate agent-readable project skills and starter scaffolds from requirements documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ravi Chandu Ummadisetti" }]
license = { text = "MIT" }
keywords = ["ai", "agents", "cli", "developer-tools", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "beautifulsoup4>=4.14.0",
  "cryptography>=42.0.0",
  "deepagents>=0.4.11",
  "langchain>=1.0.0",
  "langchain-anthropic>=1.0.0",
  "langchain-google-genai>=4.2.0",
  "langchain-huggingface>=0.3.1",
  "langchain-openai>=1.0.0",
  "openpyxl>=3.1.0",
  "pypdf>=6.0.0",
  "python-pptx>=1.0.0",
  "PyYAML>=6.0.0",
  "tree-sitter-language-pack>=0.10.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.1"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.6"]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
]

[project.scripts]
skilgen = "skilgen.cli.main:console_main"
skillayer-agent = "packages.skillayer_agent.cli:console_main"

[project.urls]
Homepage = "https://github.com/skilgen/skilgen"
Repository = "https://github.com/skilgen/skilgen"
Issues = "https://github.com/skilgen/skilgen/issues"


[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["skilgen*", "packages*", "apps.api*", "apps.worker*"]
