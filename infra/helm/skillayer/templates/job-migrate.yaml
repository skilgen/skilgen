apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "skillayer.fullname" . }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ include "skillayer.fullname" . }}-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - alembic
            - -c
            - /app/apps/api/alembic.ini
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: {{ include "skillayer.fullname" . }}-config
            - secretRef:
                name: {{ include "skillayer.fullname" . }}-secret
