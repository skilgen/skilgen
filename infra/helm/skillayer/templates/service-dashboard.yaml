apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillayer.fullname" . }}-dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: {{ .Values.dashboard.service.port }}
  selector:
    app: {{ include "skillayer.fullname" . }}-dashboard
