{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "skillayer.fullname" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
{{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
{{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "skillayer.fullname" $ }}-{{ .service }}
                port:
                  number: {{ ternary $.Values.api.service.port $.Values.dashboard.service.port (eq .service "api") }}
{{- end }}
{{- end }}
{{- if .Values.ingress.api.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "skillayer.fullname" . }}-api
  {{- with .Values.ingress.api.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
{{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: {{ $.Values.ingress.api.path }}
            pathType: {{ $.Values.ingress.api.pathType }}
            backend:
              service:
                name: {{ include "skillayer.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
{{- end }}
{{- end }}
{{- end }}
