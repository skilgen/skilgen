apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillayer.fullname" . }}-dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: {{ include "skillayer.fullname" . }}-dashboard
  template:
    metadata:
      labels:
        app: {{ include "skillayer.fullname" . }}-dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          ports:
            - containerPort: {{ .Values.dashboard.service.port }}
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillayer.fullname" . }}-config
                  key: NEXT_PUBLIC_API_URL
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillayer.fullname" . }}-config
                  key: API_URL
