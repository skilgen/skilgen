name: Skilgen Sync

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

env:
  SKILGEN_SCORE_THRESHOLD: "70"
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Skilgen
        run: |
          python -m pip install --upgrade pip
          python -m pip install skilgen

      - name: Refresh skill tree
        run: skilgen deliver --project-root .

      - name: Commit refreshed outputs
        run: |
          git config user.name "skilgen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add skills '*.md'
          if git diff --cached --quiet; then
            echo "No Skilgen changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh skilgen skill tree"
          git push

  score:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Skilgen
        run: |
          python -m pip install --upgrade pip
          python -m pip install skilgen

      - name: Compute diff and score
        run: |
          skilgen diff --project-root . --json > /tmp/diff.json
          skilgen score --project-root . > /tmp/score.json

      - name: Comment score on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const diff = JSON.parse(fs.readFileSync("/tmp/diff.json", "utf8"));
            const score = JSON.parse(fs.readFileSync("/tmp/score.json", "utf8"));
            const staleCount = (diff.stale_skill_paths || []).length;
            const body = [
              `## Skilgen Score: ${Math.round(score.score)}/100`,
              ``,
              `- Groundedness: ${score.subscores.groundedness.score}/25`,
              `- Coverage: ${score.subscores.coverage.score}/25`,
              `- Freshness: ${score.subscores.freshness.score}/25`,
              `- Structure: ${score.subscores.structure.score}/25`,
              `- Stale skills: ${staleCount}`,
              staleCount > 0 ? `` : null,
              staleCount > 0 ? `Run \`skilgen deliver\` to refresh stale skills before merging.` : null,
            ].filter(Boolean).join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce score threshold
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          score = json.loads(Path("/tmp/score.json").read_text(encoding="utf-8"))
          threshold = float(os.environ.get("SKILGEN_SCORE_THRESHOLD", "70"))
          if float(score["score"]) < threshold:
              print(f"Skilgen Score {score['score']} is below the threshold of {threshold}.")
              sys.exit(1)
          print(f"Skilgen Score {score['score']} meets the threshold of {threshold}.")
          PY
